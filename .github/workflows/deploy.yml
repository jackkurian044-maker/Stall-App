name: Deploy STall to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "firebase-production"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Build the exact production artifact from this Git commit.
      - run: npm ci

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_OAUTH_REDIRECT_URI }}

      - uses: actions/upload-artifact@v4
        with:
          name: stall-production-build
          path: dist
          retention-days: 7

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: stall-app-1aab7
          channelId: live
          entryPoint: .
          firebaseToolsVersion: latest

      - name: Install Firebase Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Prepare secure Premium payment functions
        run: node functions/prepare-premium.js

      - name: Prepare Firebase CLI credentials
        run: node -e 'require("fs").writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, process.env.FIREBASE_SERVICE_ACCOUNT_JSON)'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project stall-app-1aab7 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json

      # The legacy index.js still exports pollReviews. Append the secure
      # module after checkout so its export deliberately overrides that
      # legacy scheduled function without changing unrelated functions.
      - name: Activate secure review responder module
        run: node -e 'const fs=require("fs"); const p="functions/index.js"; const s=fs.readFileSync(p,"utf8"); const line="Object.assign(exports, require(\"./reviewAutoResponder\"));"; if(!s.includes(line)){fs.appendFileSync(p,"\n"+line+"\n");}'

      # Deploy Premium payment endpoints, the manual review sync callable,
      # the secure GBP OAuth callback, and the 30-minute auto responder.
      - name: Deploy Firebase Premium and Review Functions
        run: npx --yes firebase-tools@latest deploy --only functions:createSubscription,functions:verifySubscription,functions:cancelSubscription,functions:razorpayWebhook,functions:triggerPollForVendor,functions:oauthCallback,functions:pollReviews --project stall-app-1aab7 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
