name: Restore STall Lead and Boost exports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-lead-boost-exports.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exports and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/index.js')
          s = p.read_text(encoding='utf-8')
          additions = [
              'Object.assign(exports, require("./leadEngine"));',
              'Object.assign(exports, require("./boostCampaigns"));',
          ]
          missing = [x for x in additions if x not in s]
          if missing:
              p.write_text(s.rstrip() + '\n' + '\n'.join(missing) + '\n', encoding='utf-8')
              print('Restored Lead Engine and Boost exports')
          else:
              print('Lead Engine and Boost exports already present')
          Path('.github/workflows/one-time-restore-lead-boost-exports.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js .github/workflows/one-time-restore-lead-boost-exports.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore Lead Engine and Boost function exports"
          git push
